<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Start-stop-seal simulator for MENG 4450: a PLC wired to two pushbuttons and a lamp, with its ladder program running live below it.">
<title>Seal-In Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E9ECEA; --surface:#FFFFFF; --screen:#F4F7F5; --ink:#111A17; --ink-soft:#4A5754;
  --hair:#C7CFCB; --plc:#C4CCC8; --plc-edge:#8E9A95; --plc-ink:#1B2724;
  --live:#2FBF5B; --dead:#8D9995; --lamp:#F5A623; --lamp-off:#5A4A28;
  --stop:#C0392B; --start:#2E8B57; --brass:#C8A44D; --rad:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1513; --surface:#161E1B; --screen:#101715; --ink:#E7EDEA; --ink-soft:#9AA8A3;
    --hair:#2A3733; --plc:#39433F; --plc-edge:#59645F; --plc-ink:#DCE4E1;
    --live:#3FD96C; --dead:#5E6C67; --lamp:#FFB43D; --lamp-off:#3A2F17;
    --stop:#D9503F; --start:#39A468; --brass:#B9963F;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#161E1B; --screen:#101715; --ink:#E7EDEA; --ink-soft:#9AA8A3;
  --hair:#2A3733; --plc:#39433F; --plc-edge:#59645F; --plc-ink:#DCE4E1;
  --live:#3FD96C; --dead:#5E6C67; --lamp:#FFB43D; --lamp-off:#3A2F17;
  --stop:#D9503F; --start:#39A468; --brass:#B9963F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 44px;display:flex;flex-direction:column;gap:16px}
h1{font-family:"Barlow Condensed",Arial Narrow,sans-serif;font-weight:600;font-size:32px;
  letter-spacing:.02em;margin:0}
.stage{background:var(--surface);border:1px solid var(--hair);border-radius:var(--rad);padding:10px;overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:660px}
.wire{stroke:var(--dead);stroke-width:4;fill:none;stroke-linecap:round}
.wire.live{stroke:var(--live);stroke-width:5.5}
.sym{stroke:var(--ink);stroke-width:3.5;fill:none;stroke-linecap:round}
.rail{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.coil.on{stroke:var(--live)}
.lbl{font-family:"Barlow Condensed",Arial Narrow,sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-soft)}
.lbl.onplc{fill:var(--plc-ink)}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;fill:var(--ink)}
.val{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:600;fill:var(--dead)}
.val.one{fill:var(--live)}
.pb{cursor:pointer}
.pb:focus-visible{outline:none}
.pb:focus-visible .cap{stroke:var(--brass);stroke-width:4}
.led{fill:var(--dead)}
.led.on{fill:var(--live)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button.ctl{font:inherit;font-weight:500;padding:7px 14px;border-radius:var(--rad);
  border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer}
button.ctl:hover{border-color:var(--ink-soft)}
button.ctl[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button.ctl:disabled{opacity:.4;cursor:not-allowed}
button.ctl:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;margin-left:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Seal-In Simulator</h1>

  <div class="stage">
  <svg viewBox="0 0 1000 610" role="img" aria-label="A PLC wired to two pushbuttons and a lamp, with its ladder program shown below it">

    <!-- field wires -->
    <path id="wStart" class="wire" d="M108 100 H210 V118 H330"/>
    <path id="wStop"  class="wire" d="M108 196 H210 V186 H330"/>
    <path id="wOut"   class="wire" d="M660 152 H770 V128 H852"/>

    <!-- start pushbutton -->
    <g class="pb" id="btnStart" tabindex="0" role="button" aria-label="Start pushbutton" aria-pressed="false">
      <circle class="cap" cx="76" cy="100" r="30" fill="var(--start)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="76" cy="100" r="19" fill="rgba(255,255,255,.22)"/>
      <text class="lbl" x="76" y="152" text-anchor="middle">Start</text>
    </g>
    <!-- stop pushbutton -->
    <g class="pb" id="btnStop" tabindex="0" role="button" aria-label="Stop pushbutton" aria-pressed="false">
      <circle class="cap" cx="76" cy="196" r="30" fill="var(--stop)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="76" cy="196" r="19" fill="rgba(255,255,255,.22)"/>
      <text class="lbl" x="76" y="248" text-anchor="middle">Stop</text>
    </g>

    <!-- PLC enclosure -->
    <rect x="330" y="46" width="330" height="212" rx="8" fill="var(--plc)" stroke="var(--plc-edge)" stroke-width="3"/>
    <text class="lbl onplc" x="495" y="82" text-anchor="middle" style="font-size:22px;letter-spacing:.14em">PLC</text>

    <!-- input terminals -->
    <rect x="330" y="100" width="88" height="36" rx="4" fill="var(--surface)" stroke="var(--plc-edge)" stroke-width="2"/>
    <text class="tag" x="344" y="123">IN 0</text>
    <circle id="ledIn0" class="led" cx="402" cy="118" r="6"/>
    <rect x="330" y="168" width="88" height="36" rx="4" fill="var(--surface)" stroke="var(--plc-edge)" stroke-width="2"/>
    <text class="tag" x="344" y="191">IN 1</text>
    <circle id="ledIn1" class="led" cx="402" cy="186" r="6"/>

    <!-- output terminal -->
    <rect x="572" y="134" width="88" height="36" rx="4" fill="var(--surface)" stroke="var(--plc-edge)" stroke-width="2"/>
    <text class="tag" x="582" y="157">OUT 0</text>
    <circle id="ledOut0" class="led" cx="646" cy="152" r="6"/>

    <!-- lamp -->
    <circle id="lamp" cx="884" cy="128" r="32" fill="var(--lamp-off)" stroke="var(--ink)" stroke-width="3"/>
    <text class="lbl" x="884" y="182" text-anchor="middle">Motor run</text>

    <!-- cable from PLC down to the program -->
    <path class="wire" style="stroke:var(--plc-edge);stroke-width:3" d="M495 258 V300"/>

    <!-- program panel -->
    <rect x="150" y="300" width="760" height="280" rx="8" fill="var(--screen)" stroke="var(--hair)" stroke-width="2"/>
    <text class="lbl" x="176" y="330">Program</text>

    <line class="rail" x1="210" y1="352" x2="210" y2="552"/>
    <line class="rail" x1="850" y1="352" x2="850" y2="552"/>

    <path id="w1" class="wire live" d="M210 402 H310"/>
    <path id="b1" class="wire live" d="M270 402 V492 H310"/>
    <path id="w2" class="wire" d="M350 402 H450"/>
    <path id="b2" class="wire" d="M350 492 H450 V402"/>
    <path id="w3" class="wire" d="M450 402 H540"/>
    <path id="w4" class="wire" d="M580 402 H676"/>
    <path id="w5" class="wire" d="M724 402 H850"/>

    <line class="sym" x1="310" y1="382" x2="310" y2="422"/>
    <line class="sym" x1="350" y1="382" x2="350" y2="422"/>
    <text class="tag" x="330" y="368" text-anchor="middle">Start_PB</text>
    <text class="val" id="vStart" x="330" y="444" text-anchor="middle">0</text>

    <line class="sym" x1="310" y1="472" x2="310" y2="512"/>
    <line class="sym" x1="350" y1="472" x2="350" y2="512"/>
    <text class="tag" x="330" y="459" text-anchor="middle">Motor_Run</text>
    <text class="val" id="vSeal" x="330" y="536" text-anchor="middle">0</text>

    <line class="sym" x1="540" y1="382" x2="540" y2="422"/>
    <line class="sym" x1="580" y1="382" x2="580" y2="422"/>
    <line class="sym" x1="533" y1="427" x2="587" y2="377"/>
    <text class="tag" x="560" y="368" text-anchor="middle">Stop_PB</text>
    <text class="val" id="vStop" x="560" y="444" text-anchor="middle">0</text>

    <path id="coilA" class="sym coil" d="M696 378 A 24 24 0 0 0 696 426"/>
    <path id="coilB" class="sym coil" d="M704 378 A 24 24 0 0 1 704 426"/>
    <text class="tag" x="700" y="368" text-anchor="middle">Motor_Run</text>
    <text class="val" id="vCoil" x="700" y="444" text-anchor="middle">0</text>
  </svg>
  </div>

  <div class="controls">
    <button class="ctl" id="btnRun" aria-pressed="true">Free run</button>
    <button class="ctl" id="btnStep" disabled>Single scan</button>
    <button class="ctl" id="btnReset">Reset</button>
    <span class="count">scan <span id="scanN">0</span></span>
  </div>
</div>

<script>
(function(){
  var io={start:0,stop:0}, latch={start:0,stop:0};
  var bits={motor:0};
  var running=true, scanN=0, timer=null;
  var $=function(id){return document.getElementById(id)};
  function setWire(id,on){ $(id).classList.toggle('live',!!on); }
  function setLed(id,on){ $(id).classList.toggle('on',!!on); }
  function setVal(id,v){ var e=$(id); e.textContent=v; e.classList.toggle('one',v===1); }

  function scan(){
    var inStart = running ? io.start : latch.start;
    var inStop  = running ? io.stop  : latch.stop;
    var readMotor = bits.motor;
    var startC = inStart===1;
    var sealC  = readMotor===1;
    var node   = startC || sealC;
    var stopC  = inStop===0;
    var coil   = node && stopC;
    bits.motor = coil ? 1 : 0;
    scanN++;
    render(inStart,inStop,readMotor,startC,sealC,node,stopC,coil);
  }

  function render(inStart,inStop,readMotor,startC,sealC,node,stopC,coil){
    setWire('wStart',inStart===1); setWire('wStop',inStop===1);
    setLed('ledIn0',inStart===1);  setLed('ledIn1',inStop===1);
    setWire('wOut',bits.motor===1); setLed('ledOut0',bits.motor===1);
    $('lamp').setAttribute('fill', bits.motor===1 ? 'var(--lamp)' : 'var(--lamp-off)');
    setWire('w2',startC); setWire('b2',sealC);
    setWire('w3',node); setWire('w4',node&&stopC); setWire('w5',node&&stopC);
    setVal('vStart',inStart); setVal('vStop',inStop);
    setVal('vSeal',readMotor); setVal('vCoil',coil?1:0);
    $('coilA').classList.toggle('on',coil); $('coilB').classList.toggle('on',coil);
    $('scanN').textContent=scanN;
    $('btnStart').setAttribute('aria-pressed',inStart===1?'true':'false');
    $('btnStop').setAttribute('aria-pressed',inStop===1?'true':'false');
  }
  function idle(){ render(running?io.start:latch.start, running?io.stop:latch.stop,
                          bits.motor,false,false,false,true,false); }

  function loop(){ if(running){ scan(); timer=setTimeout(loop,140); } }

  function wireButton(el,key){
    function down(e){ e.preventDefault();
      if(running){ io[key]=1; } else { latch[key]=latch[key]?0:1; idle(); }
    }
    function up(){ if(running){ io[key]=0; } }
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointerleave',up);
    el.addEventListener('pointercancel',up);
    el.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){ if(!e.repeat) down(e); } });
    el.addEventListener('keyup',function(e){ if(e.key===' '||e.key==='Enter'){ up(); } });
  }
  wireButton($('btnStart'),'start');
  wireButton($('btnStop'),'stop');

  $('btnRun').addEventListener('click',function(){
    running=!running;
    this.setAttribute('aria-pressed',running?'true':'false');
    this.textContent = running ? 'Free run' : 'Stopped';
    $('btnStep').disabled = running;
    if(running){ latch.start=0; latch.stop=0; loop(); }
    else { clearTimeout(timer); io.start=0; io.stop=0; idle(); }
  });
  $('btnStep').addEventListener('click',scan);
  $('btnReset').addEventListener('click',function(){
    bits.motor=0; io.start=0; io.stop=0; latch.start=0; latch.stop=0; scanN=0; idle();
  });

  idle(); loop();
})();
</script>

</body>
</html>
